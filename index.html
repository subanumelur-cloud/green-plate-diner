<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Plate Diner - Table Order</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="ticket">
    <header class="header">
      <h1>Green Plate Diner</h1>
      <div class="sub">PURE VEG &bull; FRESH &bull; SERVED FAST</div>
      <div class="table-badge" id="tableBadge">TABLE --</div>
    </header>

    <section aria-labelledby="menuTitle">
      <h2 class="section-title" id="menuTitle">Menu</h2>
      <div id="menuList"></div>
    </section>

    <section class="summary" aria-live="polite" aria-label="Order summary">
      <div id="summaryLines"></div>
      <div class="summary-row summary-total">
        <span>TOTAL</span>
        <span id="totalAmount">0.00</span>
      </div>
    </section>

    <div class="field">
      <label for="customerName">Your name (optional)</label>
      <input type="text" id="customerName" maxlength="40" autocomplete="name" />
    </div>

    <div class="field">
      <label for="note">Special instructions</label>
      <textarea id="note" rows="2" maxlength="200" placeholder="Less spicy, no onion..."></textarea>
    </div>

    <button type="button" class="order-btn preview-btn" id="previewBtn">Preview Order</button>
    <pre class="preview" id="previewBox" hidden></pre>

    <a class="order-btn" id="orderBtn" href="#" aria-disabled="true" target="_blank" rel="noopener">
      Send Order
    </a>
    <p class="notice" id="notice">Add at least one item to place your order.</p>

    <footer class="footer">
      THANK YOU FOR DINING WITH US<br />
      PLEASE SHOW THIS TICKET TO STAFF
    </footer>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
